name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    name: KassiOS ⨯ ChaosBank (simulator)
    # ChaosBank is written "main actor by default"
    # (SWIFT_DEFAULT_ACTOR_ISOLATION), which needs Xcode 26+. Pick the newest
    # Xcode on the image, matching ChaosBank's own CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install xcodeproj
        run: sudo gem install xcodeproj

      - name: Generate the integration project
        run: ruby gen.rb

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro ' | grep -oE '[0-9A-Fa-f-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run the KassiOS UI tests against ChaosBank (clean profile)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ChaosBankKassiOS.xcodeproj \
            -scheme ChaosBankKassiOSUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | tail -120

  # Every defect the suite claims to catch must turn its tests red, one defect at
  # a time. The defect → tests map is generated from the tests' "Catches `id`"
  # doc lines (tools/gen_mutants.py), so it can't drift from the code. Runs in
  # parallel with the clean run.
  mutants:
    name: Each defect turns its tests red (kassios-mutants)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install xcodeproj
        run: sudo gem install xcodeproj

      - name: Generate the integration project
        run: ruby gen.rb

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro ' | grep -oE '[0-9A-Fa-f-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-Fa-f-]{36}')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: The manifest is up to date with the tests
        run: |
          python3 tools/gen_mutants.py > /tmp/mutants.json
          diff <(python3 -c "import json,sys;print(json.dumps(json.load(open('mutants.json'))['mutants'],indent=1))") \
               <(python3 -c "import json,sys;print(json.dumps(json.load(open('/tmp/mutants.json'))['mutants'],indent=1))") \
            || { echo "::error::mutants.json is stale: run python3 tools/gen_mutants.py > mutants.json"; exit 1; }

      - name: Build once
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ChaosBankKassiOS.xcodeproj -scheme ChaosBankKassiOSUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Run every defect against its tests
        run: |
          swift build -c release --package-path vendor/KassiOS --product kassios-mutants
          KASS_DEST="id=${{ steps.sim.outputs.udid }}" python3 tools/gen_mutants.py > ci-mutants.json
          vendor/KassiOS/.build/release/kassios-mutants ci-mutants.json --log-dir mutant-logs

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutant-logs
          path: mutant-logs
