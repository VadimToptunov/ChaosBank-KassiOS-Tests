name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    name: KassiOS ⨯ ChaosBank (simulator)
    # ChaosBank is written "main actor by default"
    # (SWIFT_DEFAULT_ACTOR_ISOLATION), which needs Xcode 26+. Pick the newest
    # Xcode on the image, matching ChaosBank's own CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install xcodeproj
        run: sudo gem install xcodeproj

      - name: Generate the integration project
        run: ruby gen.rb

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro ' | grep -oE '[0-9A-Fa-f-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run the KassiOS UI tests against ChaosBank (clean profile)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ChaosBankKassiOS.xcodeproj \
            -scheme ChaosBankKassiOSUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | tail -120

      # Dogfooding contract, enforced: the clean-pass flows must go RED under
      # their defects (injected via the runner env, no test edits). A green defect
      # build — or a build error that yields zero test failures — fails the job.
      - name: Buggy-matrix — clean-pass flows must go red under their defects
        env:
          CB_DEFECTS: wrongA11yLabel,limitValidation,orderStuckPending,cardToggleInvert,cardCvvVisible
        run: |
          set -o pipefail
          if TEST_RUNNER_CB_INJECT_DEFECTS="$CB_DEFECTS" xcodebuild test \
              -project ChaosBankKassiOS.xcodeproj \
              -scheme ChaosBankKassiOSUITests \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -only-testing:ChaosBankKassiOSUITests/OrderTests \
              -only-testing:ChaosBankKassiOSUITests/CardTests \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee buggy.log | tail -60; then
            echo "::error::defect build stayed green — the dogfooding contract is broken"
            exit 1
          fi
          fails=$(grep -c 'failed (.*seconds)' buggy.log || true)
          echo "defect-caught test failures: $fails (expected 5)"
          [ "$fails" -eq 5 ] || { echo "::error::expected 5 tests to fail under their defects, saw $fails (build error?)"; exit 1; }
          echo "✓ all 5 clean-pass flows went red under exactly their defects"
